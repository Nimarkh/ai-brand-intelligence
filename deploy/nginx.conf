# Example edge reverse proxy for production.
# Place TLS certificates on the host or managed load balancer — do not generate
# certificates inside the application containers.
#
# Topology:
#   Browser --HTTPS--> this proxy --> frontend (static) and backend (API)
#
# Adjust upstream hostnames to match your platform (Compose service names,
# Kubernetes service DNS, or managed endpoints).

upstream frontend_upstream {
    server frontend:8080;
}

upstream backend_upstream {
    server backend:8000;
}

# Redirect HTTP → HTTPS (enable when certificates are configured).
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;
    server_name _;

    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Align with backend RequestSizeLimitMiddleware (1 MiB).
    client_max_body_size 1m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Enable when serving exclusively over HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API — never cache authenticated responses publicly.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # Static / SPA (if the frontend container already proxies /api, you may
    # route all traffic to frontend_upstream instead).
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
