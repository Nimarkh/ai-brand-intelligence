<div class="auth">
  <section class="auth__card" aria-labelledby="register-title">
    <div class="auth__brand">
      <app-mark [size]="32" />
      <p class="auth__product">AI Brand Intelligence</p>
    </div>
    <h1 id="register-title">Create account</h1>
    <p class="auth__lead">Register with your name, email, and a password of at least 8 characters.</p>

    <form class="auth__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <app-input
        label="Full name"
        type="text"
        formControlName="full_name"
        autocomplete="name"
        [error]="fieldError('full_name', 'Enter your full name.')"
      />

      <app-input
        label="Email"
        type="email"
        formControlName="email"
        autocomplete="email"
        placeholder="you@company.com"
        [error]="fieldError('email', 'Enter a valid email address.')"
      />

      <app-input
        label="Password"
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [error]="fieldError('password', 'Password must be at least 8 characters.')"
      />

      @if (errorMessage(); as message) {
        <app-error-state [message]="message" />
      }

      <button appButton type="submit" variant="primary" [block]="true" [disabled]="submitDisabled" [loading]="submitting()">
        @if (submitting()) {
          Creating account…
        } @else {
          Create account
        }
      </button>
    </form>

    <p class="auth__footer">
      Already have an account?
      <a routerLink="/login">Sign in</a>
    </p>
  </section>
</div>
